name: Kubernetes CDC lakehouse smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'k8s/**'
      - 'sql/init.sql'
      - 'spark_jobs/**'
      - 'spark/Dockerfile'
      - 'config/debezium-connector.json'
      - 'scripts/kubernetes_cdc_smoke.py'
      - 'scripts/kubernetes_stage_ready.py'
      - 'scripts/kubernetes_recovery.py'
      - 'scripts/kubernetes_console_smoke.py'
      - 'api/**'
      - 'frontend/**'
      - 'scripts/kubernetes_diagnostics.py'
      - 'scripts/cdc_smoke.py'
      - 'hive/Dockerfile'
      - 'security/trino-access-control.json'
      - '.github/workflows/kubernetes-smoke.yml'
  pull_request:
    paths:
      - 'helm/**'
      - 'k8s/**'
      - 'sql/init.sql'
      - 'spark_jobs/**'
      - 'spark/Dockerfile'
      - 'config/debezium-connector.json'
      - 'scripts/kubernetes_cdc_smoke.py'
      - 'scripts/kubernetes_stage_ready.py'
      - 'scripts/kubernetes_recovery.py'
      - 'scripts/kubernetes_console_smoke.py'
      - 'api/**'
      - 'frontend/**'
      - 'scripts/kubernetes_diagnostics.py'
      - 'scripts/cdc_smoke.py'
      - '.github/workflows/kubernetes-smoke.yml'

permissions:
  contents: read

concurrency:
  group: kubernetes-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-broker:
    name: Isolated kind cluster — CDC lakehouse
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          cluster_name: cdc-smoke
          wait: 120s
      - name: Render and validate against Kubernetes API
        run: |
          set -euo pipefail
          umask 077
          value=$(openssl rand -hex 24)
          echo "::add-mask::$value"
          root=$(openssl rand -hex 24)
          echo "::add-mask::$root"
          replication=$(openssl rand -hex 24)
          database=$(openssl rand -hex 24)
          echo "::add-mask::$replication"
          echo "::add-mask::$database"
          args=(--namespace cdc-pipeline -f helm/cdc-pipeline/values-ci.yaml --set-file postgres.initSql=sql/init.sql --set-file trino.accessRules=security/trino-access-control.json --set-file connect.config=config/debezium-connector.json --set-string "postgres.password=$value,minio.password=$value,api.secretKey=$value,api.adminPassword=$value,api.databasePassword=$database,grafana.adminPassword=$value,mariadb.hivePassword=$value,mariadb.rootPassword=$root,connect.enabled=true,connect.password=$replication,streaming.enabled=true,monitoring.enabled=true,api.image=cdc-api:ci,frontend.image=cdc-frontend:ci")
          kubectl create namespace cdc-pipeline
          helm template cdc helm/cdc-pipeline "${args[@]}" > /tmp/cdc-full.yaml
          kubectl -n cdc-pipeline apply --dry-run=server -f /tmp/cdc-full.yaml
          for overlay in dev prod; do
            kubectl apply --dry-run=server -k "k8s/overlays/$overlay"
          done
          helm template cdc helm/cdc-pipeline "${args[@]}" \
            --show-only templates/configmap.yaml --show-only templates/secrets.yaml \
            --show-only templates/postgres-deployment.yaml --show-only templates/kafka-statefulset.yaml > /tmp/cdc-subset.yaml
          kubectl -n cdc-pipeline apply -f /tmp/cdc-subset.yaml
          kubectl -n cdc-pipeline get deployment cdc-postgres cdc-zookeeper
          kubectl -n cdc-pipeline get statefulset cdc-kafka
          rm -f /tmp/cdc-full.yaml /tmp/cdc-subset.yaml
      - name: Verify source initialization and logical replication
        run: |
          set -euo pipefail
          kubectl -n cdc-pipeline rollout status deployment/cdc-postgres --timeout=300s
          pg() {
            kubectl -n cdc-pipeline exec deployment/cdc-postgres -- sh -ec 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -Atc "$1"' sh "$1"
          }
          test "$(pg 'SHOW wal_level')" = logical
          test "$(pg "SELECT count(*) FROM pg_publication_tables WHERE pubname='debezium_pub' AND schemaname='public'")" = 6
          test "$(pg "SELECT rolreplication FROM pg_roles WHERE rolname='debezium'")" = t
          pg 'CREATE TABLE ci_persistence_probe (id integer PRIMARY KEY); INSERT INTO ci_persistence_probe VALUES (1);'
          old_uid=$(kubectl -n cdc-pipeline get pod -l app.kubernetes.io/component=postgres -o jsonpath='{.items[0].metadata.uid}')
          kubectl -n cdc-pipeline delete pod -l app.kubernetes.io/component=postgres --timeout=120s
          timeout 180 bash -ec '
            until new_uid=$(kubectl -n cdc-pipeline get pod -l app.kubernetes.io/component=postgres -o jsonpath="{.items[0].metadata.uid}" 2>/dev/null) && [ -n "$new_uid" ] && [ "$new_uid" != "$1" ]; do sleep 2; done
          ' sh "$old_uid"
          kubectl -n cdc-pipeline rollout status deployment/cdc-postgres --timeout=300s
          kubectl -n cdc-pipeline wait --for=condition=Ready pod -l app.kubernetes.io/component=postgres --timeout=180s
          test "$(pg 'SELECT count(*) FROM ci_persistence_probe')" = 1
      - name: Verify Kafka topic and actual message delivery
        run: |
          set -euo pipefail
          kubectl -n cdc-pipeline rollout status statefulset/cdc-kafka --timeout=300s
          kafka() { kubectl -n cdc-pipeline exec -i cdc-kafka-0 -- "$@"; }
          kafka kafka-topics --bootstrap-server cdc-kafka:9092 --create --if-not-exists --topic ci-smoke --partitions 1 --replication-factor 1
          printf '%s\n' cdc-cluster-smoke | kafka kafka-console-producer --bootstrap-server cdc-kafka:9092 --topic ci-smoke
          kafka kafka-console-consumer --bootstrap-server cdc-kafka:9092 --topic ci-smoke --from-beginning --max-messages 1 --timeout-ms 30000 | grep -Fx cdc-cluster-smoke
      - name: Build and load Hive image
        run: |
          docker build -t cdc-hive-metastore:ci hive
          kind load docker-image cdc-hive-metastore:ci --name cdc-smoke
      - name: Deploy private object store and catalog database
        run: |
          set -euo pipefail
          umask 077
          # Render the next subset with the original ephemeral credential values.
          value=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
          root=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.MARIADB_ROOT_PASSWORD}' | base64 -d)
          echo "::add-mask::$value"
          echo "::add-mask::$root"
          replication=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.DEBEZIUM_PASSWORD}' | base64 -d)
          database=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.API_DB_PASSWORD}' | base64 -d)
          echo "::add-mask::$database"
          echo "::add-mask::$replication"
          args=(--namespace cdc-pipeline -f helm/cdc-pipeline/values-ci.yaml --set-file postgres.initSql=sql/init.sql --set-file trino.accessRules=security/trino-access-control.json --set-file connect.config=config/debezium-connector.json --set-string "postgres.password=$value,minio.password=$value,api.secretKey=$value,api.adminPassword=$value,api.databasePassword=$database,grafana.adminPassword=$value,mariadb.hivePassword=$value,mariadb.rootPassword=$root,connect.enabled=true,connect.password=$replication,streaming.enabled=true,monitoring.enabled=true,api.image=cdc-api:ci,frontend.image=cdc-frontend:ci")
          helm template cdc helm/cdc-pipeline "${args[@]}" --show-only templates/minio.yaml --show-only templates/mariadb.yaml | kubectl -n cdc-pipeline apply -f -
          kubectl -n cdc-pipeline rollout status deployment/cdc-minio --timeout=300s
          kubectl -n cdc-pipeline wait --for=condition=complete job/cdc-minio-init --timeout=300s
          kubectl -n cdc-pipeline rollout status deployment/cdc-mariadb --timeout=300s
          kubectl -n cdc-pipeline port-forward svc/cdc-minio 19000:9000 >/tmp/minio-forward.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          timeout 30 bash -ec 'until curl -fsS http://127.0.0.1:19000/minio/health/ready >/dev/null; do sleep 1; done'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19000/warehouse/)" = 403
          helm template cdc helm/cdc-pipeline "${args[@]}" --show-only templates/hive-metastore.yaml --show-only templates/trino.yaml | kubectl -n cdc-pipeline apply -f -
      - name: Verify Hive catalog and Trino authorization
        run: |
          set -euo pipefail
          kubectl -n cdc-pipeline rollout status deployment/cdc-hive-metastore --timeout=480s
          kubectl -n cdc-pipeline rollout status deployment/cdc-trino --timeout=480s
          # HTTP availability alone does not guarantee the query engine is initialized.
          timeout 240 bash -ec '
            until kubectl -n cdc-pipeline exec deployment/cdc-trino -- trino --user api --execute "SELECT 1" > /tmp/trino-ready.log 2>&1; do
              sleep 5
            done
          ' || { cat /tmp/trino-ready.log; exit 1; }
          kubectl -n cdc-pipeline exec deployment/cdc-trino -- trino --user api --execute 'SHOW SCHEMAS FROM iceberg'
          if kubectl -n cdc-pipeline exec deployment/cdc-trino -- trino --user api --execute 'CREATE SCHEMA iceberg.security_probe' >/tmp/denial.log 2>&1; then
            echo "Unexpected schema creation permission"
            exit 1
          fi
          grep -qi 'Access Denied' /tmp/denial.log
      - name: Deploy and register Debezium
        run: |
          set -euo pipefail
          umask 077
          value=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
          root=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.MARIADB_ROOT_PASSWORD}' | base64 -d)
          replication=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.DEBEZIUM_PASSWORD}' | base64 -d)
          database=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.API_DB_PASSWORD}' | base64 -d)
          echo "::add-mask::$database"
          for secret in "$value" "$root" "$replication"; do echo "::add-mask::$secret"; done
          args=(--namespace cdc-pipeline -f helm/cdc-pipeline/values-ci.yaml --set-file postgres.initSql=sql/init.sql --set-file trino.accessRules=security/trino-access-control.json --set-file connect.config=config/debezium-connector.json --set-string "postgres.password=$value,minio.password=$value,api.secretKey=$value,api.adminPassword=$value,api.databasePassword=$database,grafana.adminPassword=$value,mariadb.hivePassword=$value,mariadb.rootPassword=$root,connect.enabled=true,connect.password=$replication,streaming.enabled=true,monitoring.enabled=true,api.image=cdc-api:ci,frontend.image=cdc-frontend:ci")
          # A synthetic initial customer ensures Gold's initial snapshot is nonempty.
          kubectl -n cdc-pipeline exec deployment/cdc-postgres -- sh -ec 'export PGPASSWORD="$POSTGRES_PASSWORD"; exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "$1"' sh "INSERT INTO customers(name,email,city,segment) VALUES ('Initial fixture','initial-fixture@example.invalid','Rabat','B2C');"
          helm template cdc helm/cdc-pipeline "${args[@]}" --show-only templates/connect.yaml | kubectl -n cdc-pipeline apply -f -
          kubectl -n cdc-pipeline rollout status deployment/cdc-kafka-connect --timeout=300s
          kubectl -n cdc-pipeline wait --for=condition=complete job/cdc-connector-register --timeout=420s
          kubectl -n cdc-pipeline logs job/cdc-connector-register -c provision-cdc-topics
          for table in customers products orders order_items payments returns; do
            kubectl -n cdc-pipeline exec cdc-kafka-0 -- kafka-topics --bootstrap-server cdc-kafka:9092 --describe --topic "cdc.public.$table"
          done
          kubectl -n cdc-pipeline port-forward svc/cdc-kafka-connect 18083:8083 >/tmp/connect-forward.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          timeout 180 bash -ec '
            until curl -fsS http://127.0.0.1:18083/connectors/cdc-postgres/status | python -c "import json,sys; s=json.load(sys.stdin); tasks=s.get(\"tasks\",[]); sys.exit(not (s[\"connector\"][\"state\"]==\"RUNNING\" and tasks and all(t[\"state\"]==\"RUNNING\" for t in tasks)))"; do sleep 5; done
          '
      - name: Install manifest parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Build Spark jobs image
        run: |
          docker build -f spark/Dockerfile -t cdc-spark-jobs:ci .
          docker run --rm --entrypoint /bin/sh cdc-spark-jobs:ci -ec 'test "$(id -u)" = 185; test -w "$HOME"; test -w /tmp/spark-local; test -r /opt/spark-apps/bronze_job.py'
          kind load docker-image cdc-spark-jobs:ci --name cdc-smoke
      - name: Run real Kubernetes Bronze, Silver and Gold lifecycle
        run: |
          set -euo pipefail
          umask 077
          value=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
          root=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.MARIADB_ROOT_PASSWORD}' | base64 -d)
          replication=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.DEBEZIUM_PASSWORD}' | base64 -d)
          database=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.API_DB_PASSWORD}' | base64 -d)
          echo "::add-mask::$database"
          for secret in "$value" "$root" "$replication"; do echo "::add-mask::$secret"; done
          args=(--namespace cdc-pipeline -f helm/cdc-pipeline/values-ci.yaml --set-file postgres.initSql=sql/init.sql --set-file trino.accessRules=security/trino-access-control.json --set-file connect.config=config/debezium-connector.json --set-string "postgres.password=$value,minio.password=$value,api.secretKey=$value,api.adminPassword=$value,api.databasePassword=$database,grafana.adminPassword=$value,mariadb.hivePassword=$value,mariadb.rootPassword=$root,connect.enabled=true,connect.password=$replication,streaming.enabled=true,monitoring.enabled=true,api.image=cdc-api:ci,frontend.image=cdc-frontend:ci")
          helm template cdc helm/cdc-pipeline "${args[@]}" --show-only templates/streaming.yaml > /tmp/cdc-streaming.yaml
          # Require all tables, an actual initial fixture and live upstream pods.
          for layer in bronze silver gold; do
            python -c 'import sys; import yaml; docs=yaml.safe_load_all(open(sys.argv[1])); print(yaml.safe_dump_all(d for d in docs if d and d["metadata"]["name"]=="cdc-spark-"+sys.argv[2]))' /tmp/cdc-streaming.yaml "$layer" | kubectl -n cdc-pipeline apply -f -
            python scripts/kubernetes_stage_ready.py "$layer" --timeout 900
          done
          python scripts/kubernetes_cdc_smoke.py --gold --timeout 480 --gold-timeout 720 --output artifacts/kubernetes-cdc-smoke.json
          python scripts/kubernetes_stage_ready.py gold --timeout 180
      - name: Verify persistent checkpoint recovery
        run: python scripts/kubernetes_recovery.py
      - name: Build and load application images
        run: |
          docker build --target prod -t cdc-api:ci api
          docker build --target prod -t cdc-frontend:ci frontend
          kind load docker-image cdc-api:ci cdc-frontend:ci --name cdc-smoke
      - name: Deploy application and observability
        run: |
          set -euo pipefail
          umask 077
          value=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
          root=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.MARIADB_ROOT_PASSWORD}' | base64 -d)
          replication=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.DEBEZIUM_PASSWORD}' | base64 -d)
          database=$(kubectl -n cdc-pipeline get secret cdc-secrets -o jsonpath='{.data.API_DB_PASSWORD}' | base64 -d)
          for secret in "$value" "$root" "$replication" "$database"; do echo "::add-mask::$secret"; done
          args=(--namespace cdc-pipeline -f helm/cdc-pipeline/values-ci.yaml --set-file postgres.initSql=sql/init.sql --set-file trino.accessRules=security/trino-access-control.json --set-file connect.config=config/debezium-connector.json --set-string "postgres.password=$value,minio.password=$value,api.secretKey=$value,api.adminPassword=$value,api.databasePassword=$database,grafana.adminPassword=$value,mariadb.hivePassword=$value,mariadb.rootPassword=$root,connect.enabled=true,connect.password=$replication,streaming.enabled=true,monitoring.enabled=true,api.image=cdc-api:ci,frontend.image=cdc-frontend:ci")
          helm template cdc helm/cdc-pipeline "${args[@]}" --show-only templates/api-db-init.yaml | kubectl -n cdc-pipeline apply -f -
          kubectl -n cdc-pipeline wait --for=condition=complete job/cdc-api-db-init --timeout=240s
          helm template cdc helm/cdc-pipeline "${args[@]}" --show-only templates/api-deployment.yaml --show-only templates/frontend-deployment.yaml --show-only templates/monitoring.yaml | kubectl -n cdc-pipeline apply -f -
          for component in api frontend prometheus grafana; do
            kubectl -n cdc-pipeline rollout status deployment/cdc-"$component" --timeout=360s
          done
      - name: Verify console and live monitoring
        run: python scripts/kubernetes_console_smoke.py
      - name: Collect cluster diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          kubectl -n cdc-pipeline get pods,pvc,svc -o wide > artifacts/cluster-summary.txt 2>&1 || true
          kubectl -n cdc-pipeline get events --sort-by=.lastTimestamp >> artifacts/cluster-summary.txt 2>&1 || true
          for component in cdc-postgres cdc-zookeeper; do
            kubectl -n cdc-pipeline logs deployment/"$component" --tail=100 >> artifacts/cluster-summary.txt 2>&1 || true
          done
          kubectl -n cdc-pipeline logs cdc-kafka-0 --tail=100 >> artifacts/cluster-summary.txt 2>&1 || true
          # Avoid dumping catalog logs or env values that may contain credentials.
          kubectl -n cdc-pipeline get deployments,jobs >> artifacts/cluster-summary.txt 2>&1 || true
      - name: Capture sanitized Spark driver diagnostics
        if: always()
        run: python3 scripts/kubernetes_diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-source-broker-evidence
          path: |
            artifacts/cluster-summary.txt
            artifacts/kubernetes-cdc-smoke.json
            artifacts/spark-driver-diagnostics.txt
            artifacts/kubernetes-recovery.json
            artifacts/kubernetes-console.json
