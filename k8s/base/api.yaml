apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: ghcr.io/elghouali/cdc-pipeline-bigdata/cdc-api:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: API_SECRET_KEY
            - name: API_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: API_ADMIN_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              value: postgres
            - name: DATABASE_URL
              # Assembled from injected env vars at pod startup.
              # Without this the API falls back to the docker-compose default
              # which uses the wrong host and hardcoded password.
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/ecommerce"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: TRINO_URL
              value: "http://trino:8080"
            - name: KAFKA_CONNECT_URL
              value: "http://kafka-connect:8083"
            - name: SPARK_MASTER_URL
              value: "http://spark-master:8080"
            - name: SPARK_HISTORY_URL
              value: "http://spark-master:18080"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http