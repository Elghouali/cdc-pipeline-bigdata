apiVersion: v1
kind: Secret
metadata:
  name: cdc-secrets
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | required "postgres.password is required" | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.password | required "minio.password is required" | quote }}
  API_SECRET_KEY: {{ .Values.api.secretKey | required "api.secretKey is required" | quote }}
  MARIADB_HIVE_PASSWORD: {{ .Values.mariadb.hivePassword | default "hive" | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | required "grafana.adminPassword is required" | quote }}
