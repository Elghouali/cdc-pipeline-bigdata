name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job. Jobs that need more declare it locally.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Lint Python (spark_jobs + api) with ruff
  # ──────────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.17.6

      - name: Ruff check
        run: |
          TARGETS="spark_jobs/"
          if [ -d api ]; then TARGETS="$TARGETS api/"; fi
          echo "Linting: $TARGETS"
          ruff check $TARGETS

      - name: Ruff format check
        run: |
          TARGETS="spark_jobs/"
          if [ -d api ]; then TARGETS="$TARGETS api/"; fi
          ruff format --check $TARGETS

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Lint shell scripts with shellcheck
  # ──────────────────────────────────────────────────────────────────────────
  lint-shell:
    name: Lint Shell (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Lint frontend (ESLint + type-check)
  # ──────────────────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend (eslint + tsc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # continue-on-error removed — frontend is complete; lint failures must block CI.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Python tests (pytest) for the API
  # ──────────────────────────────────────────────────────────────────────────
  test-python:
    name: Test Python (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          pip install --upgrade pip
          if [ -f api/requirements.txt ]; then
            pip install -r api/requirements.txt
          else
            pip install pytest pytest-asyncio httpx fastapi "uvicorn[standard]" \
              asyncpg aiokafka "passlib[bcrypt]" \
              "bcrypt>=4.0,<4.1" pyjwt pydantic python-dotenv
          fi

      - name: Run pytest
        run: |
          if [ -d api/tests ]; then
            cd api && python -m pytest tests/ -v --tb=short
          else
            echo "api/tests not present yet — skipping Python tests."
          fi

      - name: Test CDC acceptance harness (offline)
        run: python -m unittest discover -s tests -v

  test-spark:
    name: Silver ordering tests (local Spark)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install pyspark==3.5.5
      - run: python -m unittest discover -s spark_tests -v
        env:
          SPARK_LOCAL_IP: "127.0.0.1"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Frontend unit tests (Vitest)
  # ──────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend (vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # continue-on-error removed — frontend is complete; test failures must block CI.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --run

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: Secret scanning with detect-secrets
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (detect-secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan and enforce audited baseline
        run: |
          test -f .secrets.baseline
          detect-secrets scan --baseline .secrets.baseline
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path(".secrets.baseline").read_text(encoding="utf-8"))
          if not isinstance(baseline.get("results"), dict):
              raise SystemExit("Invalid baseline: missing results mapping")
          unsafe = [
              (path, entry.get("line_number"))
              for path, entries in baseline["results"].items()
              for entry in entries
              if entry.get("is_secret") is not False
          ]
          for path, line in unsafe:
              print(f"Unreviewed or confirmed secret finding: {path}:{line}")
          if unsafe:
              raise SystemExit("Secret findings must be reviewed; rotate real credentials.")
          print("No unreviewed or confirmed secret findings.")
          PY

  # ──────────────────────────────────────────────────────────────────────────
  # Job 7: Build, scan and publish Docker images
  # ──────────────────────────────────────────────────────────────────────────
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, lint-shell, lint-frontend, test-python, test-frontend, secret-scan, test-spark, render-deployment]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local images
        run: |
          docker build --target prod -t cdc-api:ci ./api
          docker build --target prod -t cdc-frontend:ci ./frontend

      - name: Scan API runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdc-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: api-vulnerabilities.json
          exit-code: '0'

      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cdc-frontend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: frontend-vulnerabilities.json
          exit-code: '0'

      - name: Scan repository dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: dependency-vulnerabilities.json
          exit-code: '0'

      - name: Validate and summarize vulnerability reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("api", "frontend", "dependency"):
              report = json.loads(Path(f"{name}-vulnerabilities.json").read_text())
              assert isinstance(report.get("SchemaVersion"), int), name
              counts = {"HIGH": 0, "CRITICAL": 0}
              for result in report.get("Results") or []:
                  for finding in result.get("Vulnerabilities") or []:
                      severity = finding.get("Severity")
                      if severity in counts:
                          counts[severity] += 1
              print(name, counts)
          PY

      - name: Upload vulnerability evidence (report-only baseline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports
          path: '*-vulnerabilities.json'
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish both images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          for component in api frontend; do
            for tag in "$GITHUB_SHA" latest; do
              docker tag "cdc-$component:ci" "$namespace/cdc-$component:$tag"
              docker push "$namespace/cdc-$component:$tag"
            done
          done

  render-deployment:
    name: Validate Helm and Kustomize rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Helm chart with ephemeral test values
        run: |
          set -euo pipefail
          value=$(python -c 'import secrets; print(secrets.token_hex(24))')
          helm lint helm/cdc-pipeline --set-string postgres.password="$value",minio.password="$value",api.secretKey="$value",api.adminPassword="$value",grafana.adminPassword="$value",mariadb.hivePassword="$value"
          helm template cdc helm/cdc-pipeline --set-string postgres.password="$value",minio.password="$value",api.secretKey="$value",api.adminPassword="$value",grafana.adminPassword="$value",mariadb.hivePassword="$value" > /tmp/cdc-helm.yaml
          test -s /tmp/cdc-helm.yaml
      - name: Render Kustomize base and overlays
        run: |
          for path in k8s/base k8s/overlays/dev k8s/overlays/prod; do
            kubectl kustomize "$path" > /tmp/cdc-kustomize.yaml
            test -s /tmp/cdc-kustomize.yaml
          done
