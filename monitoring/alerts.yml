groups:
  - name: cdc-pipeline-alerts
    rules:
      - alert: CDCLagHigh
        expr: kafka_consumergroup_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has lag {{ $value }} (> 1000) for over 5m."

      - alert: SparkJobFailed
        expr: spark_streaming_query_active == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Spark streaming query is not active"
          description: "Spark streaming has no active queries for over 3m — the CDC streaming pipeline appears to have stopped."

      - alert: DiskUsageHigh
        expr: (minio_node_disk_used_bytes / minio_node_disk_total_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage is high"
          description: "MinIO disk usage on {{ $labels.server }} is above 85% ({{ $value | humanizePercentage }})."

      - alert: KafkaBrokerDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "The Kafka exporter target is unreachable — the Kafka broker appears to be down."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "The Postgres exporter target is unreachable — the source database appears to be down."

      - alert: HighAPIErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "The CDC API is returning 5xx errors at {{ $value | humanize }} req/s (> 0.1) over the last 5m."
