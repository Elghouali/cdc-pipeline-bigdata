apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay: scaled replicas, higher resource limits, PDBs.
resources:
  - ../../base
  - pdb.yaml

namespace: cdc-pipeline

commonLabels:
  app.kubernetes.io/environment: prod

replicas:
  - name: spark-worker
    count: 3
  - name: api
    count: 1
  - name: frontend
    count: 2

patches:
  # Raise Spark worker resource limits for production workloads.
  - target:
      kind: Deployment
      name: spark-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
  # Raise API resource limits.
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
