apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdc-mariadb-data
spec:
  accessModes: [ReadWriteOnce]
  {{- include "cdc-pipeline.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.mariadb.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: cdc-mariadb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: mariadb
    {{- include "cdc-pipeline.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp
      port: 3306
      targetPort: tcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-mariadb
  labels:
    app.kubernetes.io/component: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cdc-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        {{- include "cdc-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mariadb
    spec:
      automountServiceAccountToken: false
      {{- include "cdc-pipeline.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["--character-set-server=utf8", "--collation-server=utf8_unicode_ci"]
          ports:
            - name: tcp
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: MARIADB_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: MARIADB_HIVE_PASSWORD
            - {name: MYSQL_USER, value: hive}
            - {name: MYSQL_DATABASE, value: metastore}
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: cdc-mariadb-data}
