# ─────────────────────────────────────────────
#  CDC Pipeline — Helm values
#  Override per environment with -f or --set.
# ─────────────────────────────────────────────

global:
  namespace: cdc-pipeline
  # Set to "" to use the cluster default StorageClass.
  storageClass: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

# ── Source database ───────────────────────────
postgres:
  image: postgres:15
  database: ecommerce
  user: postgres
  # REQUIRED: supply via --set postgres.password=... or a secrets file.
  password: ""
  # Supply the source schema with --set-file postgres.initSql=sql/init.sql.
  initSql: ""
  seedSql: ""
  service:
    port: 5432
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ── Kafka + Zookeeper ─────────────────────────
kafka:
  image: confluentinc/cp-kafka:7.5.0
  replicas: 1
  zookeeperImage: confluentinc/cp-zookeeper:7.5.0
  service:
    port: 9092
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

connect:
  enabled: false
  image: debezium/connect:2.5
  password: ""
  # Supply config/debezium-connector.json via --set-file connect.config=...
  config: ""
  resources:
    requests: {cpu: "250m", memory: "384Mi"}
    limits: {cpu: "1", memory: "1Gi"}

streaming:
  enabled: false
  # Build spark/Dockerfile from the repository root and load into kind.
  image: cdc-spark-jobs:ci
  driverMemory: 1g
  goldIntervalSeconds: 30
  resources:
    requests: {cpu: "500m", memory: "1Gi"}
    limits: {cpu: "2", memory: "2304Mi"}

# ── MinIO object storage ──────────────────────
minio:
  image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  clientImage: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
  rootUser: minioadmin
  # REQUIRED: supply via --set minio.password=...
  password: ""
  bucket: warehouse
  service:
    apiPort: 9000
    consolePort: 9001
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# ── MariaDB (Hive Metastore backend) ──────────
mariadb:
  image: mariadb:10.11
  rootPassword: ""
  hivePassword: ""
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

hive:
  # Build hive/Dockerfile and load into kind for CI; provide your own registry image for other clusters.
  image: cdc-hive-metastore:ci
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

# ── Spark ─────────────────────────────────────
spark:
  image: apache/spark:3.5.3-python3
  master:
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
  worker:
    replicas: 3
    workerMemory: 1g
    workerCores: 2
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "4Gi"

# ── Trino query engine ────────────────────────
trino:
  image: trinodb/trino:435
  workerReplicas: 1
  # Supply the existing read-only policy via --set-file trino.accessRules=security/trino-access-control.json.
  accessRules: ""
  service:
    port: 8080
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# ── FastAPI backend ───────────────────────────
api:
  image: ghcr.io/elghouali/cdc-pipeline-bigdata/cdc-api:latest
  replicas: 1
  # REQUIRED: supply via --set api.secretKey=...
  secretKey: ""
  adminPassword: ""
  service:
    port: 8000
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70

# ── React frontend ────────────────────────────
frontend:
  image: ghcr.io/elghouali/cdc-pipeline-bigdata/cdc-frontend:latest
  replicas: 1
  service:
    port: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# ── Grafana (observability) ───────────────────
grafana:
  # REQUIRED: supply via --set grafana.adminPassword=... or a secrets file.
  # "admin" was a weak shipped default; now enforced required in secrets.yaml.
  adminPassword: ""

# ── Ingress ───────────────────────────────────
ingress:
  enabled: false
  className: nginx
  host: cdc.local
  annotations: {}
  tls:
    enabled: false
    secretName: cdc-tls

# ── Pod Disruption Budgets ────────────────────
podDisruptionBudget:
  enabled: false
