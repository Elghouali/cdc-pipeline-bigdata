# Development override — use via: make dev
# Merges with docker-compose.yml via:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Changes vs production:
#   - Spark workers retain the same per-executor resource budget
#   - Restart-on-failure for streaming services
#   - API hot-reload via volume mount
#   - Frontend dev server with hot-reload

version: "3.8"

services:

  spark-master:
    restart: on-failure
    environment:
      SPARK_LOG_LEVEL: INFO

  spark-worker:
    restart: on-failure
    environment:
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: 2
      SPARK_LOG_LEVEL: INFO

  kafka-connect:
    restart: on-failure

  # ── API service (hot-reload) ──────────────────────────────────────────────────
  api:
    build:
      context: ./api
      target: dev
    volumes:
      - ./api:/app

  # ── Frontend dev server (hot-reload) ─────────────────────────────────────────
  # Frontend now exists — uncommented from Phase 3 placeholder.
  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "3000:3000"
