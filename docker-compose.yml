version: "3.8"

# ─────────────────────────────────────────────
#  CDC Pipeline — full local stack
#  Services: postgres, zookeeper, kafka,
#            kafka-connect (debezium),
#            minio, minio-init,
#            mariadb, hive-metastore,
#            spark-master, spark-worker,
#            trino, superset
# ─────────────────────────────────────────────

networks:
  cdc-net:
    driver: bridge

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  minio-data:
  mariadb-data:
  ivy2-cache:          # Maven/Ivy JAR cache shared across Spark containers
  prometheus-data:
  grafana-data:
  pipeline-runtime:

# ─────────────────────────────────────────────
services:

  # ── Source database ──────────────────────────
  postgres:
    image: postgres:15
    container_name: cdc-postgres
    environment:
      POSTGRES_DB:       ecommerce
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      DEBEZIUM_PASSWORD: "${DEBEZIUM_PASSWORD:?Set DEBEZIUM_PASSWORD in .env}"
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=4
      -c max_replication_slots=4
      -c track_commit_timestamp=on
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cdc-net

  # ── Zookeeper (Kafka coordination) ────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cdc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cdc-net

  # ── Kafka broker ──────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cdc-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID:                         1
      KAFKA_ZOOKEEPER_CONNECT:                 zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:              PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:    PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:        PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:  1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:     1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:         "true"
      KAFKA_LOG_RETENTION_HOURS:               168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:  0
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - cdc-net

  # ── Kafka Connect + Debezium ──────────────────
  kafka-connect:
    image: debezium/connect:2.5
    container_name: cdc-kafka-connect
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS:               kafka:9092
      GROUP_ID:                        cdc-connect-group
      DEBEZIUM_PASSWORD: "${DEBEZIUM_PASSWORD:?Set DEBEZIUM_PASSWORD in .env}"
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: '^DEBEZIUM_PASSWORD$$'
      CONFIG_STORAGE_TOPIC:            debezium_connect_config
      OFFSET_STORAGE_TOPIC:            debezium_connect_offsets
      STATUS_STORAGE_TOPIC:            debezium_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR:  1
      OFFSET_STORAGE_REPLICATION_FACTOR:  1
      STATUS_STORAGE_REPLICATION_FACTOR:  1
      CONNECT_KEY_CONVERTER:           org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER:         org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE:   "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 640m
    networks:
      - cdc-net

  # ── MinIO (S3-compatible object storage) ─────
  minio:
    image: ${OBJECT_STORE_IMAGE:-docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    container_name: cdc-minio
    environment:
      MINIO_ROOT_USER:              ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD:          "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
      MINIO_PROMETHEUS_AUTH_TYPE:   "public"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - cdc-net

  # ── MinIO bucket initializer (one-shot) ───────
  minio-init:
    image: ${OBJECT_STORE_CLIENT_IMAGE:-docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    container_name: cdc-minio-init
    env_file: .env
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}; do
          echo 'Waiting for MinIO...'; sleep 3;
        done &&
        mc mb --ignore-existing local/warehouse &&
        mc anonymous set none local/warehouse &&
        echo 'Bucket warehouse is ready.'
      "
    networks:
      - cdc-net

  # ── MariaDB (Hive Metastore backend) ─────────
  mariadb:
    image: mariadb:10.11
    container_name: cdc-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MYSQL_USER:          hive
      MYSQL_PASSWORD:      ${MARIADB_HIVE_PASSWORD:-hive}
      MYSQL_DATABASE:      metastore
    command: >
      --character-set-server=utf8
      --collation-server=utf8_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - cdc-net

  # ── Hive Standalone Metastore ─────────────────
  hive-metastore:
    build:
      context: ./hive
    container_name: cdc-hive-metastore
    depends_on:
      mariadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER:    mysql
      # SERVICE_OPTS injects JVM system properties into the metastore boot script
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:mysql://mariadb:3306/metastore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=${MARIADB_HIVE_PASSWORD:-hive}
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.access.key=${MINIO_ROOT_USER:-minioadmin}
        -Dfs.s3a.secret.key=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
    ports:
      - "127.0.0.1:9083:9083"
    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/localhost/9083"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - cdc-net

  # ── Spark Master ──────────────────────────────
  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: cdc-spark-master
    restart: on-failure
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8085:8080"     # Spark Master UI
    volumes:
      - ./spark_jobs:/opt/spark-apps
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy2-cache:/root/.ivy2
      - pipeline-runtime:/var/lib/cdc-runtime
    networks:
      - cdc-net

  # ── Spark Worker ──────────────────────────────
  spark-worker:
    # One 1 GiB executor per worker; three workers support Bronze/Silver/Gold concurrently.
    scale: ${SPARK_WORKER_REPLICAS:-3}
    image: apache/spark:3.5.3-python3
    restart: on-failure
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_WEBUI_PORT: "8081"
    volumes:
      - ./spark_jobs:/opt/spark-apps
      - ./config/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy2-cache:/root/.ivy2
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - cdc-net

  # ── Trino coordinator ─────────────────────────
  trino:
    image: trinodb/trino:435
    container_name: cdc-trino
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./security/trino-access-control.properties:/etc/trino/access-control.properties:ro
      - ./security/trino-access-control.json:/etc/trino/access-control.json:ro
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./config/trino/node.properties:/etc/trino/node.properties:ro
      - ./config/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/status | grep -q coordinator"]
      interval: 15s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 3g
    networks:
      - cdc-net

  # ── Apache Superset ───────────────────────────
  superset:
    image: apache/superset:3.1.0
    container_name: cdc-superset
    depends_on:
      - trino
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-cdc_pipeline_secret_key_change_me}
    ports:
      - "127.0.0.1:8088:8088"
    command: >
      /bin/sh -c "
        pip install --quiet trino sqlalchemy-trino &&
        superset db upgrade &&
        superset fab create-admin
          --username admin
          --firstname Admin
          --lastname User
          --email admin@cdc.local
          --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true &&
        superset init &&
        superset run -p 8088 --with-threads --reload --debugger
      "
    networks:
      - cdc-net

  # ── Prometheus ────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: cdc-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cdc-net

  # ── Alertmanager ─────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cdc-alertmanager
    # envsubst expands ${SLACK_WEBHOOK_URL} before passing the config to
    # Alertmanager — the binary itself does not expand environment variables.
    entrypoint:
      - /bin/sh
      - -c
      - |
        envsubst < /etc/alertmanager/alertmanager.yml > /tmp/alertmanager_resolved.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager_resolved.yml
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/REPLACE_ME}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - cdc-net

  # ── Grafana ──────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: cdc-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cdc-net

  # ── Loki (log aggregation) ────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: cdc-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - cdc-net

  # ── Promtail (log collector) ──────────────────
  promtail:
    image: grafana/promtail:2.9.4
    container_name: cdc-promtail
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - cdc-net

  # ── Kafka Exporter ────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: cdc-kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cdc-net

  # ── Postgres Exporter ─────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: cdc-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ecommerce?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cdc-net

  # ── Backend API ───────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: prod
    container_name: cdc-api
    environment:
      API_SECRET_KEY: "${API_SECRET_KEY:?Set API_SECRET_KEY}"
      API_ADMIN_PASSWORD: "${API_ADMIN_PASSWORD:?Set API_ADMIN_PASSWORD}"
      API_ACCESS_TOKEN_EXPIRE_MINUTES: "${API_ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/ecommerce"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      TRINO_URL: "http://trino:8080"
      KAFKA_CONNECT_URL: "http://kafka-connect:8083"
      SPARK_MASTER_URL: "http://spark-master:8080"
      SPARK_HISTORY_URL: "http://spark-master:18080"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pipeline-runtime:/var/lib/cdc-runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
    restart: on-failure
    networks:
      - cdc-net

  # ── Frontend (dev server) ─────────────────────
  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: cdc-frontend
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: on-failure
    networks:
      - cdc-net

