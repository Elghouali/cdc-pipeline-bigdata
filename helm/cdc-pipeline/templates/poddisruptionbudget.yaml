{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cdc-postgres
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # maxUnavailable: 1 instead of minAvailable: 1 for single-replica services.
  # minAvailable: 1 with replicas=1 blocks all voluntary disruptions —
  # node drains and cluster maintenance become impossible indefinitely.
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "cdc-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cdc-kafka
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  # maxUnavailable: 1 instead of minAvailable: 1 for single-replica services.
  # minAvailable: 1 with replicas=1 blocks all voluntary disruptions —
  # node drains and cluster maintenance become impossible indefinitely.
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "cdc-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
{{- end }}
