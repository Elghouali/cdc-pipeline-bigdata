{{- $component := "postgres" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdc-postgres-data
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- include "cdc-pipeline.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | default "10Gi" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-postgres-initdb
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
data:
  # SQL is supplied explicitly because the chart does not package the source files.
  01-init.sql: |
    {{- .Values.postgres.initSql | required "postgres.initSql is required; use --set-file postgres.initSql=sql/init.sql" | nindent 4 }}
  02-seed.sql: |
    {{- .Values.postgres.seedSql | default "-- Optional seed data not supplied." | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-postgres
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cdc-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "cdc-pipeline.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      {{- include "cdc-pipeline.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_wal_senders=4
            - -c
            - max_replication_slots=4
            - -c
            - track_commit_timestamp=on
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cdc-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cdc-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cdc-postgres-data
        - name: initdb
          configMap:
            name: cdc-postgres-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: cdc-postgres
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdc-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port | default 5432 }}
      targetPort: postgres
