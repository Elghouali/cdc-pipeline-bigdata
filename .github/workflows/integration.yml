name: Integration Tests

on:
  # Run on demand from the Actions tab.
  workflow_dispatch:
    inputs:
      live_cdc:
        description: Verify actual Bronze/Silver/Gold CDC delivery
        type: boolean
        default: true
  # Automatically recheck infrastructure changes on main.
  push:
    branches: [main]
    paths:
      - 'hive/Dockerfile'
      - 'docker-compose.yml'
      - 'config/hive/**'
      - 'config/trino/**'
      - 'security/**'
      - 'sql/**'
      - 'config/debezium-connector.json'
      - 'scripts/register_connector.sh'
      - 'config/spark/**'
      - 'spark_jobs/**'
      - 'scripts/cdc_smoke.py'
      - 'api/**'
      - 'frontend/src/**'
      - 'Makefile'
      - '.github/workflows/integration.yml'
  # Weekly smoke test of the full stack — Sundays at 03:00 UTC.
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  integration:
    name: CDC data-stack integration
    runs-on: ubuntu-latest
    # The full Docker stack (Kafka, Postgres, Spark, Trino, ...) needs headroom.
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create test .env
        run: |
          # Generate isolated CI credentials; never use real credentials here.
          cat > .env << 'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_postgres_pass
          DEBEZIUM_PASSWORD=ci_replication_password_only
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=ci_minio_pass
          MARIADB_ROOT_PASSWORD=ci_root_pass
          MARIADB_HIVE_PASSWORD=ci_hive_pass
          SUPERSET_SECRET_KEY=ci_superset_secret_key_for_testing_only
          SUPERSET_ADMIN_PASSWORD=ci_superset_admin
          API_SECRET_KEY=ci_api_secret_key_for_testing_only
          API_ADMIN_PASSWORD=ci_admin_password_for_testing_only
          GRAFANA_ADMIN_PASSWORD=ci_grafana_pass
          SLACK_WEBHOOK_URL=https://hooks.slack.com/services/CI_PLACEHOLDER
          EOF
          echo ".env generated for CI integration run."

      - name: Install API test dependencies
        run: |
          pip install --upgrade pip
          if [ -f api/requirements.txt ]; then
            pip install -r api/requirements.txt
          else
            pip install pytest pytest-asyncio httpx
          fi

      - name: Generate config files
        run: make generate-configs

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Preflight object storage image availability
        run: docker compose pull minio minio-init

      - name: Start Docker Compose stack
        # Three independent executors for Bronze, Silver, and Gold.
        # Avoid unrelated dashboard/monitoring memory pressure on CI runners.
        run: |
          docker compose up -d --scale spark-worker=3 postgres kafka-connect spark-master spark-worker trino api

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          echo "Waiting up to 120s for all containers to report healthy..."
          timeout 120 bash -c '
            until [ "$(docker compose ps --format "{{.Health}}" \
              | grep -c -v -e "^healthy$" -e "^$" || true)" -eq 0 ]; do
              echo "  ...still waiting"
              sleep 5
            done
          '
          echo "Health checks passed for running services; one-shot initialization is enforced by Compose dependencies."
          docker compose ps

      - name: Verify local security boundary
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/warehouse/)" = 403
          timeout 60 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/events/stream)" = 401 ]; do sleep 2; done'
          docker compose ps --format json | python -c 'import sys,json; rows=[json.loads(line) for line in sys.stdin if line.strip()]; rows=[item for row in rows for item in (row if isinstance(row,list) else [row])]; publishers=[p for row in rows for p in (row.get("Publishers") or []) if p.get("PublishedPort")]; assert publishers and all(p.get("URL") in ("127.0.0.1", "::1") for p in publishers), publishers'

      - name: Verify Trino read-only enforcement
        run: |
          docker compose exec -T trino trino --user api --execute 'SELECT 1'
          if docker compose exec -T trino trino --user api --execute 'CREATE SCHEMA iceberg.security_probe' > /tmp/trino-denial.log 2>&1; then
            echo 'Unexpected schema creation permission'
            exit 1
          fi
          grep -qi 'Access Denied' /tmp/trino-denial.log

      - name: Register Debezium connector
        run: make connector-register

      - name: Run Python integration tests
        run: make test-python

      - name: Start Bronze and wait for its six tables
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.live_cdc)) }}
        timeout-minutes: 6
        run: |
          make spark-bronze
          timeout 300 bash -c '
            until [ "$(docker compose exec -T trino trino --catalog iceberg --schema analytics --output-format TSV --execute "SELECT count(*) FROM information_schema.tables WHERE table_schema = '\''analytics'\'' AND table_name IN ('\''bronze_customers_cdc'\'', '\''bronze_products_cdc'\'', '\''bronze_orders_cdc'\'', '\''bronze_order_items_cdc'\'', '\''bronze_payments_cdc'\'', '\''bronze_returns_cdc'\'')" 2>/dev/null || true)" = 6 ]; do
              sleep 10
            done
          '

      - name: Verify actual CDC lifecycle
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.live_cdc)) }}
        timeout-minutes: 45
        run: |
          make spark-silver
          timeout 300 bash -c '
            until [ "$(docker compose exec -T trino trino --catalog iceberg --schema analytics --output-format TSV --execute "SELECT count(*) FROM information_schema.tables WHERE table_schema = '\''analytics'\'' AND table_name IN ('\''silver_customers'\'', '\''silver_products'\'', '\''silver_orders'\'', '\''silver_order_items'\'', '\''silver_payments'\'', '\''silver_returns'\'')" 2>/dev/null || true)" = 6 ]; do
              sleep 10
            done
          '
          make spark-gold GOLD_REFRESH_SECONDS=30
          python scripts/cdc_smoke.py --gold --timeout 300 --gold-timeout 600 --output artifacts/cdc-smoke.json
          if docker compose exec -T trino trino --user api --execute 'SELECT raw_payload FROM iceberg.analytics.bronze_customers_cdc LIMIT 1' > /tmp/trino-denial.log 2>&1; then
            echo 'Unexpected raw payload access'
            exit 1
          fi
          grep -qi 'Access Denied' /tmp/trino-denial.log

      - name: Upload CDC evidence
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.live_cdc)) }}
        uses: actions/upload-artifact@v4
        with:
          name: cdc-smoke-evidence
          path: artifacts/cdc-smoke.json
          if-no-files-found: warn

      - name: Capture Spark driver diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose exec -T spark-master sh -c 'for f in /tmp/cdc-*.log; do if [ -f "$f" ]; then echo "=== $f ==="; tail -n 250 "$f"; fi; done' > artifacts/spark-drivers.log 2>&1 || true
          docker compose ps -a
          if [ "${{ job.status }}" = failure ]; then cat artifacts/spark-drivers.log; fi

      - name: Upload Spark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-driver-diagnostics
          path: artifacts/spark-drivers.log

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
