apiVersion: v1
kind: Service
metadata:
  name: cdc-hive-metastore
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: hive-metastore
    {{- include "cdc-pipeline.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp
      port: 9083
      targetPort: tcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-hive-metastore
  labels:
    app.kubernetes.io/component: hive-metastore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cdc-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hive-metastore
  template:
    metadata:
      labels:
        {{- include "cdc-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hive-metastore
    spec:
      automountServiceAccountToken: false
      {{- include "cdc-pipeline.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-storage
          image: busybox:1.36
          command: ["sh", "-ec", "until nc -z cdc-mariadb 3306 && nc -z cdc-minio {{ .Values.minio.service.apiPort }}; do sleep 3; done"]
      containers:
        - name: hive-metastore
          image: {{ .Values.hive.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: tcp
              containerPort: 9083
          env:
            - name: MARIADB_HIVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: MARIADB_HIVE_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: cdc-config
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: MINIO_ROOT_PASSWORD
            - {name: SERVICE_NAME, value: metastore}
            - {name: DB_DRIVER, value: mysql}
            - name: SERVICE_OPTS
              value: >-
                -Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
                -Djavax.jdo.option.ConnectionURL=jdbc:mysql://cdc-mariadb:3306/metastore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
                -Djavax.jdo.option.ConnectionUserName=hive
                -Djavax.jdo.option.ConnectionPassword=$(MARIADB_HIVE_PASSWORD)
                -Dfs.s3a.endpoint=http://cdc-minio:{{ .Values.minio.service.apiPort }}
                -Dfs.s3a.path.style.access=true
                -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
          readinessProbe:
            tcpSocket: {port: tcp}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.hive.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /opt/hive/conf/hive-site.xml, subPath: hive-site.xml, readOnly: true}
      volumes:
        - name: config
          configMap: {name: cdc-config}
