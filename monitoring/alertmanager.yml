global:
  # Alertmanager does NOT expand environment variables in this file.
  # The docker-compose entrypoint runs:
  #   envsubst < /etc/alertmanager/alertmanager.yml > /tmp/alertmanager_resolved.yml
  # Set SLACK_WEBHOOK_URL in your .env file (e.g. https://hooks.slack.com/services/XXX).
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack'
  routes:
    - match:
        severity: critical
      repeat_interval: 1h
      receiver: 'slack'

receivers:
  - name: 'slack'
    slack_configs:
      - channel: '#cdc-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] CDC Pipeline – {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}*[{{ .Labels.severity | toUpper }}]* {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
