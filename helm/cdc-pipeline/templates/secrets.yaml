apiVersion: v1
kind: Secret
metadata:
  name: cdc-secrets
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.connect.enabled }}
  DEBEZIUM_PASSWORD: {{ .Values.connect.password | required "connect.password is required" | quote }}
  {{- end }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | required "postgres.password is required" | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.password | required "minio.password is required" | quote }}
  API_SECRET_KEY: {{ .Values.api.secretKey | required "api.secretKey is required" | quote }}
  API_ADMIN_PASSWORD: {{ .Values.api.adminPassword | required "api.adminPassword is required" | quote }}
  MARIADB_ROOT_PASSWORD: {{ .Values.mariadb.rootPassword | required "mariadb.rootPassword is required" | quote }}
  MARIADB_HIVE_PASSWORD: {{ .Values.mariadb.hivePassword | required "mariadb.hivePassword is required" | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | required "grafana.adminPassword is required" | quote }}
