apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay: minimal footprint, single replicas everywhere.
resources:
  - ../../base

namePrefix: dev-

commonLabels:
  app.kubernetes.io/environment: dev

replicas:
  - name: spark-worker
    count: 1
  - name: api
    count: 1
  - name: frontend
    count: 1

patches:
  - target:
      kind: Deployment
      name: spark-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
