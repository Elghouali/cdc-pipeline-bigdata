name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job. Jobs that need more declare it locally.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Lint Python (spark_jobs + api) with ruff
  # ──────────────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.17.6

      - name: Ruff check
        run: |
          TARGETS="spark_jobs/"
          if [ -d api ]; then TARGETS="$TARGETS api/"; fi
          echo "Linting: $TARGETS"
          ruff check $TARGETS

      - name: Ruff format check
        run: |
          TARGETS="spark_jobs/"
          if [ -d api ]; then TARGETS="$TARGETS api/"; fi
          ruff format --check $TARGETS

      - name: Generate reviewable lint repair patch
        if: failure()
        run: |
          ruff check --fix spark_jobs/ api/ || true
          ruff format spark_jobs/ api/
          git diff -- spark_jobs/ api/ > /tmp/ruff-repair.patch
          echo "RUFF_PATCH_START"
          base64 -w 0 /tmp/ruff-repair.patch
          echo
          echo "RUFF_PATCH_END"
          ruff check spark_jobs/ api/

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Lint shell scripts with shellcheck
  # ──────────────────────────────────────────────────────────────────────────
  lint-shell:
    name: Lint Shell (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Lint frontend (ESLint + type-check)
  # ──────────────────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint Frontend (eslint + tsc)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # continue-on-error removed — frontend is complete; lint failures must block CI.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Python tests (pytest) for the API
  # ──────────────────────────────────────────────────────────────────────────
  test-python:
    name: Test Python (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          pip install --upgrade pip
          if [ -f api/requirements.txt ]; then
            pip install -r api/requirements.txt
          else
            pip install pytest pytest-asyncio httpx fastapi "uvicorn[standard]" \
              asyncpg aiokafka "passlib[bcrypt]" \
              "bcrypt>=4.0,<4.1" pyjwt pydantic python-dotenv
          fi

      - name: Run pytest
        run: |
          if [ -d api/tests ]; then
            cd api && python -m pytest tests/ -v --tb=short
          else
            echo "api/tests not present yet — skipping Python tests."
          fi

      - name: Test CDC acceptance harness (offline)
        run: python -m unittest discover -s tests -v

  test-spark:
    name: Silver ordering tests (local Spark)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install pyspark==3.5.5
      - run: python -m unittest discover -s spark_tests -v
        env:
          SPARK_LOCAL_IP: "127.0.0.1"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Frontend unit tests (Vitest)
  # ──────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend (vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # continue-on-error removed — frontend is complete; test failures must block CI.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test -- --run

  # ──────────────────────────────────────────────────────────────────────────
  # Job 6: Secret scanning with detect-secrets
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (detect-secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Scan and enforce audited baseline
        run: |
          test -f .secrets.baseline
          detect-secrets scan --baseline .secrets.baseline
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path(".secrets.baseline").read_text(encoding="utf-8"))
          if not isinstance(baseline.get("results"), dict):
              raise SystemExit("Invalid baseline: missing results mapping")
          unsafe = [
              (path, entry.get("line_number"))
              for path, entries in baseline["results"].items()
              for entry in entries
              if entry.get("is_secret") is not False
          ]
          for path, line in unsafe:
              print(f"Unreviewed or confirmed secret finding: {path}:{line}")
          if unsafe:
              raise SystemExit("Secret findings must be reviewed; rotate real credentials.")
          print("No unreviewed or confirmed secret findings.")
          PY

  # ──────────────────────────────────────────────────────────────────────────
  # Job 7: Build & push Docker images (push to main only)
  # ──────────────────────────────────────────────────────────────────────────
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-python, lint-shell, lint-frontend, test-python, test-frontend, secret-scan, test-spark]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image namespace
        id: ns
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        if: ${{ hashFiles('api/Dockerfile') != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.repo }}/cdc-api:latest
            ghcr.io/${{ steps.ns.outputs.repo }}/cdc-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        if: ${{ hashFiles('frontend/Dockerfile') != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.repo }}/cdc-frontend:latest
            ghcr.io/${{ steps.ns.outputs.repo }}/cdc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
