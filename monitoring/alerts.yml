groups:
  - name: cdc-pipeline-alerts
    rules:
      - alert: CDCLagHigh
        expr: kafka_consumergroup_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has lag {{ $value }} (> 1000) for over 5m."

      - alert: CDCConsumerLagGrowing
        # spark_streaming_query_active never exists without a Prometheus metrics sink.
        # Use steadily-growing Kafka lag as a proxy: if Spark streams are alive they
        # consume continuously; lag that increases for 5m means processing has stalled.
        expr: increase(kafka_consumergroup_lag[10m]) > 500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CDC consumer group lag is growing — consumer group may have stalled"
          description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} lag grew by {{ $value }} messages in 10m. The reported consumer group may be stalled; this does not measure Spark checkpoint lag."

      - alert: DiskUsageHigh
        # minio_node_disk_* names are from older MinIO; 2024 MinIO exposes
        # cluster-level capacity metrics instead.
        expr: (1 - minio_cluster_capacity_raw_free_bytes / minio_cluster_capacity_raw_total_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MinIO disk usage is high"
          description: "MinIO raw disk usage is above 85% ({{ $value | humanizePercentage }}). Free up space to prevent write failures."

      - alert: KafkaBrokerDown
        expr: up{job="kafka"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka broker is down"
          description: "The Kafka exporter target is unreachable — the Kafka broker appears to be down."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "The Postgres exporter target is unreachable — the source database appears to be down."

      - alert: APIDown
        # http_requests_total requires prometheus-fastapi-instrumentator which is
        # not installed. Alert on the scrape target being unreachable instead —
        # this fires as soon as the API process dies or becomes unresponsive.
        expr: up{job="cdc-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CDC API is unreachable"
          description: "The CDC API Prometheus scrape target has been unreachable for over 1 minute — the pipeline console is offline."

      - alert: CDCDriverMissing
        expr: cdc_spark_driver_active != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Expected exactly one running Spark driver with allocated cores"
          description: "Layer {{ $labels.layer }} has {{ $value }} active drivers."

      - alert: CDCConnectorUnhealthy
        expr: cdc_connector_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Debezium connector or its tasks are not running"
