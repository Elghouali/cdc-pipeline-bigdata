apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  # maxUnavailable: 1 instead of minAvailable: 1 — minAvailable=1 on a
  # single-replica pod blocks every node drain indefinitely.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  # maxUnavailable: 1 instead of minAvailable: 1 — minAvailable=1 on a
  # single-replica pod blocks every node drain indefinitely.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
