apiVersion: batch/v1
kind: Job
metadata:
  name: cdc-api-db-init
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-db-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: provision
          image: {{ .Values.postgres.image | quote }}
          command: ["sh", "-ec"]
          args:
            - |
              until pg_isready -h cdc-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 3; done
              psql -X -h cdc-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
              \getenv api_password API_DB_PASSWORD
              SELECT 'CREATE ROLE cdc_api LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='cdc_api') \gexec
              ALTER ROLE cdc_api PASSWORD :'api_password';
              CREATE SCHEMA IF NOT EXISTS api_runtime AUTHORIZATION cdc_api;
              ALTER ROLE cdc_api SET search_path TO api_runtime;
              REVOKE ALL ON ALL TABLES IN SCHEMA public FROM cdc_api;
              SQL
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: cdc-config, key: POSTGRES_USER}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: cdc-config, key: POSTGRES_DB}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: cdc-secrets, key: POSTGRES_PASSWORD}
            - name: API_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: cdc-secrets, key: API_DB_PASSWORD}
