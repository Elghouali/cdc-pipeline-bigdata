name: Integration Tests

on:
  # Run on demand from the Actions tab.
  workflow_dispatch:
    inputs:
      live_cdc:
        description: Verify actual Bronze/Silver CDC delivery (requires full stack)
        type: boolean
        default: true
  # Weekly smoke test of the full stack — Sundays at 03:00 UTC.
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  integration:
    name: Full-Stack Integration
    runs-on: ubuntu-latest
    # The full Docker stack (Kafka, Postgres, Spark, Trino, ...) needs headroom.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create test .env
        run: |
          # Generate isolated CI credentials; never use real credentials here.
          cat > .env << 'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_postgres_pass
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=ci_minio_pass
          MARIADB_ROOT_PASSWORD=ci_root_pass
          MARIADB_HIVE_PASSWORD=ci_hive_pass
          SUPERSET_SECRET_KEY=ci_superset_secret_key_for_testing_only
          SUPERSET_ADMIN_PASSWORD=ci_superset_admin
          API_SECRET_KEY=ci_api_secret_key_for_testing_only
          API_ADMIN_PASSWORD=ci_admin_pass
          GRAFANA_ADMIN_PASSWORD=ci_grafana_pass
          SLACK_WEBHOOK_URL=https://hooks.slack.com/services/CI_PLACEHOLDER
          EOF
          echo ".env generated for CI integration run."

      - name: Install API test dependencies
        run: |
          pip install --upgrade pip
          if [ -f api/requirements.txt ]; then
            pip install -r api/requirements.txt
          else
            pip install pytest pytest-asyncio httpx
          fi

      - name: Generate config files
        run: make generate-configs

      - name: Preflight object storage image availability
        run: docker compose pull minio minio-init

      - name: Start Docker Compose stack
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          echo "Waiting up to 120s for all containers to report healthy..."
          timeout 120 bash -c '
            until [ "$(docker compose ps --format "{{.Health}}" \
              | grep -c -v -e "^healthy$" -e "^$" || true)" -eq 0 ]; do
              echo "  ...still waiting"
              sleep 5
            done
          '
          echo "All services healthy."
          docker compose ps

      - name: Register Debezium connector
        run: make connector-register

      - name: Run Python integration tests
        run: make test-python

      - name: Start Bronze and wait for its six tables
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_cdc }}
        timeout-minutes: 6
        run: |
          make spark-bronze
          timeout 300 bash -c '
            until [ "$(docker compose exec -T trino trino --catalog iceberg --schema analytics --output-format TSV --execute "SELECT count(*) FROM information_schema.tables WHERE table_schema = '\''analytics'\'' AND table_name IN ('\''bronze_customers_cdc'\'', '\''bronze_products_cdc'\'', '\''bronze_orders_cdc'\'', '\''bronze_order_items_cdc'\'', '\''bronze_payments_cdc'\'', '\''bronze_returns_cdc'\'')" 2>/dev/null || true)" = 6 ]; do
              sleep 10
            done
          '

      - name: Verify actual CDC lifecycle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_cdc }}
        timeout-minutes: 20
        run: |
          make spark-silver
          python scripts/cdc_smoke.py --timeout 180 --output artifacts/cdc-smoke.json

      - name: Upload CDC evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.live_cdc }}
        uses: actions/upload-artifact@v4
        with:
          name: cdc-smoke-evidence
          path: artifacts/cdc-smoke.json
          if-no-files-found: warn

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans
