{{- $component := "kafka" -}}
# ── Zookeeper (separate Deployment) ───────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-zookeeper
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cdc-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: zookeeper
  template:
    metadata:
      labels:
        {{- include "cdc-pipeline.labels" . | nindent 8 }}
        app.kubernetes.io/component: zookeeper
    spec:
      {{- include "cdc-pipeline.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: zookeeper
          image: {{ .Values.kafka.zookeeperImage | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: client
              containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cdc-zookeeper
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: zookeeper
spec:
  type: ClusterIP
  selector:
    {{- include "cdc-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: client
---
# ── Kafka headless service (StatefulSet) ──────
apiVersion: v1
kind: Service
metadata:
  name: cdc-kafka-headless
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  clusterIP: None
  selector:
    {{- include "cdc-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: broker
      port: 9092
      targetPort: broker
---
# ── Kafka client service (ClusterIP) ──────────
apiVersion: v1
kind: Service
metadata:
  name: cdc-kafka
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdc-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: broker
      port: {{ .Values.kafka.service.port | default 9092 }}
      targetPort: broker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cdc-kafka
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  # NOTE: single broker for simplicity. To scale, raise kafka.replicas and
  # add a per-pod broker.id (use the ordinal from the pod hostname) plus a
  # higher replication factor for the offsets/transaction-state topics.
  serviceName: cdc-kafka-headless
  replicas: {{ .Values.kafka.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "cdc-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "cdc-pipeline.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      {{- include "cdc-pipeline.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-zookeeper
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z cdc-zookeeper 2181; do echo waiting for zookeeper; sleep 3; done
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: broker
              containerPort: 9092
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKER_ID
              # Derive broker ID from the StatefulSet ordinal (cdc-kafka-0 → 1,
              # cdc-kafka-1 → 2, …) so scaling kafka.replicas above 1 produces
              # unique IDs. A hardcoded "1" causes ID conflicts on multi-broker.
              value: "$(expr 1 + $(echo $POD_NAME | sed 's/.*-//'))"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "cdc-zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              # Use the pod-specific headless DNS name so each broker advertises
              # its own address; cdc-kafka (shared service) only routes to one pod.
              value: "PLAINTEXT://$(POD_NAME).cdc-kafka-headless:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cdc-pipeline.labels" . | nindent 10 }}
          app.kubernetes.io/component: {{ $component }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- include "cdc-pipeline.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size | default "10Gi" }}
