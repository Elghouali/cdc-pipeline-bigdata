# Run entirely as the distribution's unprivileged nginx user.
worker_processes auto;
pid /tmp/cdc-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/cdc-client-body;
    proxy_temp_path /tmp/cdc-proxy;
    fastcgi_temp_path /tmp/cdc-fastcgi;
    uwsgi_temp_path /tmp/cdc-uwsgi;
    scgi_temp_path /tmp/cdc-scgi;
    include /tmp/cdc-server.conf;
}
