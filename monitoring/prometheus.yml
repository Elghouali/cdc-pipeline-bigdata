global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
  - job_name: cdc-api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
  # spark: omitted — spark-defaults.conf has no PrometheusServlet sink configured.
  # To re-enable: add spark.metrics.conf with a PrometheusServlet sink, then
  # uncomment and set metrics_path: /metrics/prometheus/
  # - job_name: spark
  #   static_configs:
  #     - targets: ['spark-master:4040']
  #   metrics_path: /metrics/prometheus/
