{{- $component := "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-api
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cdc-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "cdc-pipeline.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      {{- include "cdc-pipeline.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: api
          image: {{ .Values.api.image | default "ghcr.io/your-org/cdc-api:latest" | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port | default 8000 }}
          envFrom:
            - configMapRef:
                name: cdc-config
          env:
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: API_SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cdc-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              value: cdc-postgres
            - name: DATABASE_URL
              # Assembled at pod startup using Kubernetes env-var substitution.
              # Without this, the API falls back to the docker-compose default
              # "postgresql://postgres:postgres@postgres:5432/ecommerce" which
              # has the wrong host and password for a Kubernetes deployment.
              value: "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@cdc-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database }}"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cdc-api
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "cdc-pipeline.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      port: {{ .Values.api.service.port | default 8000 }}
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cdc-api
  labels:
    {{- include "cdc-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cdc-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas | default 5 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage | default 70 }}
{{- end }}
