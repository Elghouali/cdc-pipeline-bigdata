# Trino coordinator configuration
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Memory limits (single-node coordinator-only).
# Xmx2G heap: headroom(256MB) + query(1GB) + OS/overhead headroom.
# query.max-memory must not exceed query.max-memory-per-node on a
# single-node deployment — a 2GB cluster limit with a 1GB per-node cap
# means the per-node limit always fires first, making 2GB unreachable.
query.max-memory=1GB
query.max-memory-per-node=1GB
memory.heap-headroom-per-node=256MB
